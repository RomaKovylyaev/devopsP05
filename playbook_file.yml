---
- name: NMAP scan targets from copied file and report
  hosts: webservers
  remote_user: runner
  become: true
  gather_facts: false

  tasks:
    - name: Install NMAP
      ansible.builtin.apt:
        name: nmap
        state: present
        update_cache: true

    - name: Copy nmap targets list
      ansible.builtin.copy:
        src: ./targets.txt
        dest: ~/targets.txt
        force: true
        mode: "0644"

    - name: Run nmap against targets file
      ansible.builtin.command: "nmap -iL ~/targets.txt -p 80 -oG -"
      register: nmap_result
      changed_when: false

    - name: Print nmap scan output
      ansible.builtin.debug:
        msg: "{{ nmap_result.stdout_lines }}"
